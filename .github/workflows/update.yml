name: Update Subscriptions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-parser-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maxminddb requests telethon

      - name: Download Xray Core
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused -L \
               -o xray.zip \
               https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Fetch Sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          fetch_raw() {
            local out="$1"
            local url="$2"
            local code
            code=$(curl --retry 5 --retry-delay 5 --retry-all-errors \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              -L -o "$out" -w "%{http_code}" "$url" || echo "000")
            if [ "$code" != "200" ]; then
              echo "WARN: $out fetch HTTP $code"
              rm -f "$out"
              touch "$out"
              return 1
            fi
            if grep -qiE 'too many requests|rate limit exceeded|documentation_url|Not Found' "$out" 2>/dev/null; then
              echo "WARN: $out looks like an API error page"
              rm -f "$out"
              touch "$out"
              return 1
            fi
            return 0
          }

          fetch_raw sources_wl.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_wl.txt" \
            && echo ok > /tmp/fetch_wl.ok || true

          fetch_raw sources_bl.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_bl.txt" \
            && echo ok > /tmp/fetch_bl.ok || true

          fetch_raw sources_tg.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_tg.txt" || true

          if fetch_raw incoming_sources.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/incoming_sources.txt"; then
            cp incoming_sources.txt /tmp/incoming_snapshot.txt
            echo ok > /tmp/fetch_incoming.ok
          else
            touch /tmp/incoming_snapshot.txt
          fi

          fetch_raw incoming_subs.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/incoming_subs.txt" || true

          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused -L \
               -o GeoLite2-Country.mmdb \
               https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Ensure Base Files Exist
        run: |
          touch white_ip.txt sources_wl.txt sources_bl.txt sources_tg.txt \
                incoming_sources.txt incoming_subs.txt
          mkdir -p arch/lists

      - name: Update Sources from Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: python parser_tg.py

      - name: Run Parser Script
        run: python parser.py

      - name: Sync Updated Sources to apex-sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://$GH_PAT@github.com/Diversan313/apex-sources.git temp_src
          cd temp_src

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          if [ -f /tmp/fetch_wl.ok ] && [ -s ../sources_wl.txt ]; then
            cp ../sources_wl.txt ./sources_wl.txt
          fi
          if [ -f /tmp/fetch_bl.ok ] && [ -s ../sources_bl.txt ]; then
            cp ../sources_bl.txt ./sources_bl.txt
          fi

          # Очищаем очередь только от тех IP, что реально скачали в начале прогона.
          # IP, добавленные во время длинного парсинга, остаются.
          if [ -f /tmp/fetch_incoming.ok ]; then
            # Удаляем только IP из снимка начала прогона; новые (добавленные позже) оставляем
            if [ -f incoming_sources.txt ] && [ -s /tmp/incoming_snapshot.txt ]; then
              awk 'NF && $0 !~ /^#/' /tmp/incoming_snapshot.txt | sort -u > /tmp/snap_norm.txt
              awk 'NF && $0 !~ /^#/' incoming_sources.txt | sort -u > /tmp/cur_norm.txt
              comm -13 /tmp/snap_norm.txt /tmp/cur_norm.txt > /tmp/incoming_kept.txt || true
              cp /tmp/incoming_kept.txt incoming_sources.txt
              echo "incoming queue updated (removed processed snapshot IPs)"
            else
              > incoming_sources.txt
              echo "incoming queue cleared (snapshot empty or no current file)"
            fi
          else
            echo "incoming fetch failed earlier — queue NOT cleared"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources_wl.txt sources_bl.txt incoming_sources.txt
          if ! git diff --cached --quiet; then
            git commit -m "sync updated sources from TG and clear processed queue"
            git pull --rebase --autostash origin main || true
            git push origin main
          else
            echo "No source changes to push."
          fi
          cd ..
          rm -rf temp_src

      - name: Commit and Push Results to apex-parser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/apex-out arch/lists
          cp -f alive_bs.txt alive_bl.txt alive_full.txt white_ip.txt /tmp/apex-out/ 2>/dev/null || true
          cp -f arch/lists/whitelist.txt /tmp/apex-out/whitelist.txt 2>/dev/null || true

          rm -f xray xray.zip GeoLite2-Country.mmdb \
                sources_wl.txt sources_bl.txt sources_tg.txt \
                incoming_sources.txt incoming_subs.txt white_ip_health.json

          git fetch origin main
          git reset --hard origin/main

          mkdir -p arch/lists
          cp -f /tmp/apex-out/alive_bs.txt alive_bs.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_bl.txt alive_bl.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_full.txt alive_full.txt 2>/dev/null || true
          cp -f /tmp/apex-out/whitelist.txt arch/lists/whitelist.txt 2>/dev/null || true

          # white_ip — только накопление: объединяем origin + результат парсера
          # (никогда не удаляем уже записанные IP)
          cat white_ip.txt /tmp/apex-out/white_ip.txt 2>/dev/null             | awk 'NF && $0 !~ /^#/'             | sort -u > /tmp/white_ip_merged.txt
          cp /tmp/white_ip_merged.txt white_ip.txt

          git add white_ip.txt alive_bs.txt alive_bl.txt alive_full.txt \
                  arch/lists/whitelist.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "auto update proxies and white_ip"
            git push origin main
          fi

      - name: Deploy Subscriptions to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "ОШИБКА: Секрет GITVERSE_TOKEN не найден в GitHub Secrets!"
            exit 1
          fi

          rm -rf deploy_gitverse
          mkdir deploy_gitverse
          cp alive_bs.txt alive_bl.txt alive_full.txt deploy_gitverse/ 2>/dev/null || true

          cd deploy_gitverse
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "auto update subscriptions"
          git remote add origin "https://bikinitw22:${GITVERSE_TOKEN}@gitverse.ru/bikinitw22/apelsintel.git"
          git push --force origin main

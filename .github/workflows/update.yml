name: Update Subscriptions

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-parser-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Xray Core
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused -L \
               -o xray.zip \
               https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Fetch White IP
        run: |
          # Public apex-white-ip — без токена
          curl --retry 5 --retry-delay 3 --retry-all-errors -L \
               -o white_ip.txt \
               "https://raw.githubusercontent.com/Diversan313/apex-white-ip/main/white_ip.txt" \
            || touch white_ip.txt
          echo "White IP lines: $(grep -cve '^\s*$' white_ip.txt 2>/dev/null || echo 0)"

      - name: Fetch Sources (private)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # При SECURE_SOURCES_GITHUB=True workflow кладёт файлы в корень.
          # При SECURE=False парсер читает apex/sources/ из checkout — этот шаг просто no-op при ошибке.
          fetch_raw() {
            local out="$1"
            local url="$2"
            local code
            code=$(curl --retry 5 --retry-delay 5 --retry-all-errors \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              -L -o "$out" -w "%{http_code}" "$url" || echo "000")
            if [ "$code" != "200" ]; then
              echo "WARN: $out fetch HTTP $code"
              rm -f "$out"
              touch "$out"
              return 1
            fi
            if grep -qiE 'too many requests|rate limit exceeded|documentation_url|Not Found' "$out" 2>/dev/null; then
              echo "WARN: $out looks like an API error page"
              rm -f "$out"
              touch "$out"
              return 1
            fi
            return 0
          }

          if [ -n "$GH_PAT" ]; then
            fetch_raw sources_wl.txt \
              "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_wl.txt" || true
            fetch_raw sources_bl.txt \
              "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_bl.txt" || true
            fetch_raw sources_tg.txt \
              "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_tg.txt" || true
          else
            echo "GH_PAT not set — skip private sources (ожидаются apex/sources/)"
            touch sources_wl.txt sources_bl.txt sources_tg.txt
          fi

          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused -L \
               -o GeoLite2-Country.mmdb \
               https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Ensure Base Files Exist
        run: |
          touch white_ip.txt sources_wl.txt sources_bl.txt sources_tg.txt
          mkdir -p arch/lists stats subs/main \
                   subs/other/AI subs/other/torrent subs/other/countries \
                   apex/sources

      - name: Update Sources from Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          # Без TG_SESSION_STRING parser_tg сразу выходит
          if [ -n "$TG_SESSION_STRING" ]; then
            python -m apex.modules.parser_tg
          else
            echo "TG_SESSION_STRING not set — skip parser_tg"
          fi

      - name: Run Parser Script
        run: python -m apex.parser

      - name: Sync apex-sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not set — skip sync apex-sources"
            exit 0
          fi

          git clone https://$GH_PAT@github.com/Diversan313/apex-sources.git temp_src
          cd temp_src

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          if [ -n "$TG_SESSION_STRING" ]; then
            PYTHONPATH=.. python -m apex.modules.parser_tg
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources_wl.txt sources_bl.txt sources_tg.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Sync sources from Telegram"
            git pull --rebase --autostash origin main || true
            git push origin main
          else
            echo "No source changes to push."
          fi
          cd ..
          rm -rf temp_src

      - name: Commit and Push Results to apex-parser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/apex-out arch/lists stats subs/main \
                   subs/other/AI subs/other/torrent subs/other/countries

          # main lists
          cp -f subs/main/alive_bs.txt subs/main/alive_bl.txt subs/main/alive_full.txt \
                subs/main/alive_plain_bs.txt subs/main/alive_plain_bl.txt subs/main/alive_plain_full.txt \
                subs/main/alive_bs.yaml subs/main/alive_bl.yaml subs/main/alive_full.yaml \
                white_ip.txt /tmp/apex-out/ 2>/dev/null || true

          # other: AI / torrent / countries
          if [ -d subs/other ]; then
            cp -a subs/other /tmp/apex-out/other 2>/dev/null || true
          fi

          cp -f arch/lists/whitelist.txt /tmp/apex-out/whitelist.txt 2>/dev/null || true
          cp -f stats/latest.json /tmp/apex-out/latest.json 2>/dev/null || true

          rm -f xray xray.zip GeoLite2-Country.mmdb \
                sources_wl.txt sources_bl.txt sources_tg.txt

          git fetch origin main
          git reset --hard origin/main

          mkdir -p arch/lists stats subs/main \
                   subs/other/AI subs/other/torrent subs/other/countries

          cp -f /tmp/apex-out/alive_bs.txt subs/main/alive_bs.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_bl.txt subs/main/alive_bl.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_full.txt subs/main/alive_full.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_plain_bs.txt subs/main/alive_plain_bs.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_plain_bl.txt subs/main/alive_plain_bl.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_plain_full.txt subs/main/alive_plain_full.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_bs.yaml subs/main/alive_bs.yaml 2>/dev/null || true
          cp -f /tmp/apex-out/alive_bl.yaml subs/main/alive_bl.yaml 2>/dev/null || true
          cp -f /tmp/apex-out/alive_full.yaml subs/main/alive_full.yaml 2>/dev/null || true

          if [ -d /tmp/apex-out/other ]; then
            rm -rf subs/other
            cp -a /tmp/apex-out/other subs/other
          fi

          cp -f /tmp/apex-out/whitelist.txt arch/lists/whitelist.txt 2>/dev/null || true
          cp -f /tmp/apex-out/latest.json stats/latest.json 2>/dev/null || true

          # white_ip: берём свежий из /tmp (уже скачан/обновлён парсером)
          if [ -f /tmp/apex-out/white_ip.txt ]; then
            cp -f /tmp/apex-out/white_ip.txt white_ip.txt
          fi

          git add white_ip.txt \
                  subs/main/alive_bs.txt subs/main/alive_bl.txt subs/main/alive_full.txt \
                  subs/main/alive_plain_bs.txt subs/main/alive_plain_bl.txt subs/main/alive_plain_full.txt \
                  subs/main/alive_bs.yaml subs/main/alive_bl.yaml subs/main/alive_full.yaml \
                  arch/lists/whitelist.txt stats/latest.json \
                  subs/other/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "auto update proxies and white_ip"
            git push origin main
          fi

      - name: Deploy Subscriptions to GitVerse
        continue-on-error: true
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "ERROR: GITVERSE_TOKEN secret is missing."
            exit 1
          fi

          rm -rf deploy_gitverse
          mkdir deploy_gitverse
          cp subs/main/alive_bs.txt subs/main/alive_bl.txt subs/main/alive_full.txt \
             subs/main/alive_plain_bs.txt subs/main/alive_plain_bl.txt subs/main/alive_plain_full.txt \
             subs/main/alive_bs.yaml subs/main/alive_bl.yaml subs/main/alive_full.yaml \
             deploy_gitverse/ 2>/dev/null || true

          if [ -d subs/other ]; then
            cp -a subs/other deploy_gitverse/other 2>/dev/null || true
          fi

          cd deploy_gitverse
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "auto update subscriptions"
          git remote add origin "https://bikinitw22:${GITVERSE_TOKEN}@gitverse.ru/bikinitw22/apelsintel.git"

          max_retries=5
          retry_count=0
          success=false

          while [ $retry_count -lt $max_retries ]; do
            git push --force origin main
            if [ $? -eq 0 ]; then
              echo "✅ Push to GitVerse succeeded."
              success=true
              break
            fi
            retry_count=$((retry_count+1))
            if [ $retry_count -lt $max_retries ]; then
              echo "⚠️ Push to GitVerse failed. Retrying in 15 seconds... (Attempt $((retry_count+1))/$max_retries)"
              sleep 15
            fi
          done

          if [ "$success" = false ]; then
            echo "⚠️ Warning: Failed to push to GitVerse after $max_retries attempts. Continuing workflow..."
          fi


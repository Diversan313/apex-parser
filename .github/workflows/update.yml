name: Update Subscriptions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maxminddb

      - name: Download Xray Core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Fetch Sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -H "Authorization: token $GH_PAT" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L -o sources_wl.txt \
               https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_wl.txt || touch sources_wl.txt

          curl -H "Authorization: token $GH_PAT" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L -o sources_bl.txt \
               https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_bl.txt || touch sources_bl.txt

          curl -H "Authorization: token $GH_PAT" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L -o incoming_sources.txt \
               https://raw.githubusercontent.com/Diversan313/apex-sources/main/incoming_sources.txt || touch incoming_sources.txt

          curl -H "Authorization: token $GH_PAT" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L -o incoming_subs.txt \
               https://raw.githubusercontent.com/Diversan313/apex-sources/main/incoming_subs.txt || touch incoming_subs.txt

          curl -L -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Ensure Base Files Exist
        run: |
          touch white_ip.txt

      - name: Run Parser Script
        run: python parser.py

      - name: Commit and Push Results to apex-parser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Удаляем временные рабочие файлы
          rm -f xray xray.zip GeoLite2-Country.mmdb sources_wl.txt sources_bl.txt incoming_sources.txt incoming_subs.txt white_ip_health.json
          
          git fetch origin main
          git reset --soft origin/main
          
          git add white_ip.txt alive_*.txt
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto update proxies and white_ip"
            git push origin main
          else
            echo "No changes."
          fi

      - name: Deploy Subscriptions to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "ОШИБКА: Секрет GITVERSE_TOKEN не найден в GitHub Secrets!"
            exit 1
          fi

          rm -rf deploy_gitverse
          mkdir deploy_gitverse
          cp alive_bs.txt alive_bl.txt alive_full.txt deploy_gitverse/ 2>/dev/null || true
          
          cd deploy_gitverse

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "auto update subscriptions"
          
          git remote add origin "https://bikinitw22:${GITVERSE_TOKEN}@gitverse.ru/bikinitw22/apelsintel.git"
          git push --force origin main

      - name: Sync Incoming State (Clear apex-sources queue)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://$GH_PAT@github.com/Diversan313/apex-sources.git temp_src
          cd temp_src
          > incoming_sources.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incoming_sources.txt
          if ! git diff-index --quiet HEAD; then
            git commit -m "clear incoming sources queue"
            git push
          fi
          cd ..
          rm -rf temp_src
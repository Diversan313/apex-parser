name: Update Subscriptions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-parser-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maxminddb requests telethon

      - name: Download Xray Core
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused -L \
               -o xray.zip \
               https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Fetch Sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          fetch_raw() {
            local out="$1"
            local url="$2"
            local code
            code=$(curl --retry 5 --retry-delay 5 --retry-all-errors \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github.v3.raw" \
              -L -o "$out" -w "%{http_code}" "$url" || echo "000")
            if [ "$code" != "200" ]; then
              echo "WARN: $out fetch HTTP $code"
              rm -f "$out"
              touch "$out"
              return 1
            fi
            if grep -qiE 'too many requests|rate limit exceeded|documentation_url|Not Found' "$out" 2>/dev/null; then
              echo "WARN: $out looks like an API error page"
              rm -f "$out"
              touch "$out"
              return 1
            fi
            return 0
          }

          fetch_raw sources_wl.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_wl.txt" || true

          fetch_raw sources_bl.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_bl.txt" || true

          fetch_raw sources_tg.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/sources_tg.txt" || true

          fetch_raw incoming_sources.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/incoming_sources.txt" || true

          # Fallback mechanism if raw download fails
          if [ ! -s incoming_sources.txt ]; then
            echo "incoming_sources.txt is empty, trying GitHub API..."
            curl -s -H "Authorization: token $GH_PAT" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -L -o incoming_sources.txt \
                 "https://api.github.com/repos/Diversan313/apex-sources/contents/incoming_sources.txt" || true
          fi

          fetch_raw incoming_subs.txt \
            "https://raw.githubusercontent.com/Diversan313/apex-sources/main/incoming_subs.txt" || true

          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused -L \
               -o GeoLite2-Country.mmdb \
               https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Ensure Base Files Exist
        run: |
          touch white_ip.txt sources_wl.txt sources_bl.txt sources_tg.txt \
                incoming_sources.txt incoming_subs.txt
          mkdir -p arch/lists

      - name: Update Sources from Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: python parser_tg.py

      - name: Run Parser Script
        run: python parser.py

      - name: Merge incoming IPs to white_ip
        run: |
          # Add new IP addresses from the incoming queue to the database
          if [ -s incoming_sources.txt ]; then
            grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' incoming_sources.txt > /tmp/incoming_ips.txt
            if [ -s /tmp/incoming_ips.txt ]; then
              touch white_ip.txt
              cat white_ip.txt /tmp/incoming_ips.txt | awk 'NF && $0 !~ /^#/' | sort -u > /tmp/white_ip_updated.txt
              cp /tmp/white_ip_updated.txt white_ip.txt
              echo "Incoming IPs merged successfully."
            fi
          else
            echo "Incoming sources file is empty."
          fi

      - name: Sync apex-sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          git clone https://$GH_PAT@github.com/Diversan313/apex-sources.git temp_src
          cd temp_src

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # Update sources from Telegram on the latest main branch
          python ../parser_tg.py

          # Clear the incoming queue completely after successful processing
          if [ -f ../white_ip.txt ]; then
            > incoming_sources.txt
            echo "Incoming sources queue cleared successfully."
          else
            echo "white_ip.txt not found. Queue cleanup skipped."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources_wl.txt sources_bl.txt incoming_sources.txt
          if ! git diff --cached --quiet; then
            git commit -m "Sync sources and clear processed queue"
            git pull --rebase --autostash origin main || true
            git push origin main
          else
            echo "No source changes to push."
          fi
          cd ..
          rm -rf temp_src

      - name: Commit and Push Results to apex-parser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/apex-out arch/lists
          cp -f alive_bs.txt alive_bl.txt alive_full.txt white_ip.txt /tmp/apex-out/ 2>/dev/null || true
          cp -f arch/lists/whitelist.txt /tmp/apex-out/whitelist.txt 2>/dev/null || true

          rm -f xray xray.zip GeoLite2-Country.mmdb \
                sources_wl.txt sources_bl.txt sources_tg.txt \
                incoming_sources.txt incoming_subs.txt white_ip_health.json

          git fetch origin main
          git reset --hard origin/main

          mkdir -p arch/lists
          cp -f /tmp/apex-out/alive_bs.txt alive_bs.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_bl.txt alive_bl.txt 2>/dev/null || true
          cp -f /tmp/apex-out/alive_full.txt alive_full.txt 2>/dev/null || true
          cp -f /tmp/apex-out/whitelist.txt arch/lists/whitelist.txt 2>/dev/null || true

          cat white_ip.txt /tmp/apex-out/white_ip.txt 2>/dev/null \
            | awk 'NF && $0 !~ /^#/' \
            | sort -u > /tmp/white_ip_merged.txt
          cp /tmp/white_ip_merged.txt white_ip.txt

          git add white_ip.txt alive_bs.txt alive_bl.txt alive_full.txt \
                  arch/lists/whitelist.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "auto update proxies and white_ip"
            git push origin main
          fi

      - name: Deploy Subscriptions to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "ERROR: GITVERSE_TOKEN secret is missing."
            exit 1
          fi

          rm -rf deploy_gitverse
          mkdir deploy_gitverse
          cp alive_bs.txt alive_bl.txt alive_full.txt deploy_gitverse/ 2>/dev/null || true

          cd deploy_gitverse
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "auto update subscriptions"
          git remote add origin "https://bikinitw22:${GITVERSE_TOKEN}@gitverse.ru/bikinitw22/apelsintel.git"
          git push --force origin main
